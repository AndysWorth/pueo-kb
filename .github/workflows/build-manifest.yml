name: Build manifest

on:
  push:
    branches: [main]

# Allow the workflow to commit back to the repo
permissions:
  contents: write

jobs:
  build:
    name: Rebuild MANIFEST.json
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Use the default GITHUB_TOKEN so we can push
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pyyaml

      - name: Build MANIFEST.json
        working-directory: scripts
        run: python3 build_manifest.py --root ..

      - name: Commit updated MANIFEST.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add MANIFEST.json
          # Only commit if something changed; [skip ci] prevents an infinite loop
          git diff --staged --quiet || git commit -m "chore: rebuild MANIFEST.json [skip ci]"
          git push
